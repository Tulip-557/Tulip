<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe3f2"/>
      <stop offset="55%" stop-color="#e8eef2"/>
      <stop offset="100%" stop-color="#f4ede1"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ea3bd"/>
      <stop offset="100%" stop-color="#4f7893"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c9384"/>
      <stop offset="100%" stop-color="#6d6558"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="905" cy="150" r="58" fill="#f7f2e2" opacity="0.85"/>
  <!-- 远山 -->
  <path d="M0 400 L170 320 L300 372 L430 318 L600 392 L780 336 L950 390 L1200 344 L1200 430 L0 430 Z" fill="#9fb2bd" opacity="0.55"/>
  <!-- 江面 -->
  <rect x="0" y="430" width="1200" height="240" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="3" fill="none">
    <path d="M40 500 q60 -12 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0"/>
    <path d="M80 560 q60 -12 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0"/>
    <path d="M20 620 q60 -12 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0"/>
  </g>
  <!-- 岸线 -->
  <path d="M0 655 q220 -28 420 6 q180 30 380 -4 q220 -36 400 2 L1200 800 L0 800 Z" fill="#8f9a7e"/>
  <path d="M0 672 q220 -28 420 6 q180 30 380 -4 q220 -36 400 2" fill="none" stroke="#6f7a60" stroke-width="4" opacity="0.6"/>
  <!-- 炮台台基 -->
  <g>
    <rect x="180" y="470" width="440" height="180" rx="8" fill="url(#stone)"/>
    <rect x="180" y="470" width="440" height="16" fill="#b3aa99"/>
    <!-- 垛口 -->
    <g fill="#8b8271">
      <rect x="196" y="440" width="52" height="34"/>
      <rect x="268" y="440" width="52" height="34"/>
      <rect x="340" y="440" width="52" height="34"/>
      <rect x="412" y="440" width="52" height="34"/>
      <rect x="484" y="440" width="52" height="34"/>
      <rect x="556" y="440" width="48" height="34"/>
    </g>
    <!-- 炮位洞口 -->
    <g fill="#40392f">
      <path d="M250 650 v-72 a40 40 0 0 1 80 0 v72 z"/>
      <path d="M400 650 v-72 a40 40 0 0 1 80 0 v72 z"/>
      <path d="M550 650 v-72 a36 36 0 0 1 72 0 v72 z"/>
    </g>
    <!-- 古炮 -->
    <g>
      <rect x="278" y="556" width="150" height="16" rx="8" fill="#3f4650" transform="rotate(-16 278 556)"/>
      <circle cx="272" cy="556" r="17" fill="#333a43"/>
    </g>
    <g>
      <rect x="432" y="556" width="150" height="16" rx="8" fill="#3f4650" transform="rotate(-16 432 556)"/>
      <circle cx="426" cy="556" r="17" fill="#333a43"/>
    </g>
  </g>
  <!-- 前景草 -->
  <path d="M0 780 q160 -26 320 4 q180 34 360 -6 q220 -40 520 6 L1200 800 L0 800 Z" fill="#5f6d4f"/>
</svg>
